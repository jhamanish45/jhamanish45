name: Update GitHub Profile Analytics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-analytics.yml"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub analytics
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/userstats.svg
          colors: dark-dimmed
          custom-title: Manish Kumar Jha - GitHub Analytics
          featured-repository: AI-MTO-Extractor
          max-languages: 8
          animated-language-chart: true
          commit-and-push: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=0D1117
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=github-compact&hide_border=true
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/userstats.svg
          git add profile/streak.svg
          git add profile/activity-graph.svg

          git commit -m "chore: update GitHub profile analytics" || exit 0
          git push
